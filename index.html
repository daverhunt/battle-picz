function showFinalResult(){let mine=roundResults.reduce((n,r)=>n+r.myScore,0),theirs=roundResults.reduce((n,r)=>n+r.oppScore,0),title=mine===theirs?'DRAW!':mine>theirs?'YOU WIN!':'YOU LOSE!',coins=mine===theirs?2:mine>theirs?3:1;$('roundSummary').classList.remove('show');showCoinReward(coins,title)}function showCategoryChooser(){intro=true;ended=true;$('nextRound').classList.remove('show');$('chooserTitle').textContent='CHOOSE CATEGORY';$('chooserPlayer').textContent=(chooserIndex===0?'Dave':'Carly S')+' chooses Round '+roundNo;$('categoryOptions').style.display='grid';$('difficultyOptions').classList.add('hidden');$('categoryChooser').classList.remove('hidden')}function chooseCategory(cat){roundCategory=cat;$('chooserTitle').textContent='CHOOSE DIFFICULTY';$('chooserPlayer').textContent=cat+' · Round '+roundNo;$('categoryOptions').style.display='none';$('difficultyOptions').classList.remove('hidden')}function chooseDifficulty(key){difficultyKey=key;difficulty=DIFFICULTIES[key];qs=QUESTION_BANKS[roundCategory].map(x=>({...x}));qi=0;streak=0;roundResults=[];document.querySelectorAll('.qt').forEach(x=>{x.className='qt';x.style.background='';x.querySelector('span').textContent='?'});$('categoryChooser').classList.add('hidden');startQ()}function endRound(){$('cat').textContent='ROUND '+roundNo+' COMPLETE';$('msg').textContent='ROUND SCORES';intro=true;ended=true;showRoundSummary()}function beginNextRound(){roundNo++;chooserIndex=1-chooserIndex;showCategoryChooser()}function runIntro(){intro=true;let layer=$('intro'),cat=$('introCat'),rsg=$('introRsg');$('introRoundText').src=INTRO_ASSETS.round_text;$('introRoundNum').src=ROUND_DIGITS[['zero','one','two','three','four','five','six','seven','eight','nine'][roundNo%10]];cat.src=INTRO_ASSETS[q().cat.toLowerCase()+'_text'];layer.classList.remove('show');cat.classList.remove('pop');rsg.classList.remove('fly');void layer.offsetWidth;layer.classList.add('show');cat.classList.add('pop');const steps=['ready_text','set_text','go_text'];steps.forEach((name,n)=>setTimeout(()=>{rsg.src=INTRO_ASSETS[name];rsg.style.width=[112,84,76][n]+'px';rsg.classList.remove('fly');void rsg.offsetWidth;rsg.classList.add('fly')},1650+n*1000));setTimeout(()=>{layer.classList.remove('show');intro=false;start=performance.now()},4650)}function positionPicture(){let r=seededRandom(seedNumber(MATCH_SEED+'|picture|'+roundNo+'|'+roundCategory+'|'+difficultyKey+'|'+qi+'|'+q().a)),spread=difficulty.offset,x=Math.round((r()*2-1)*spread),y=Math.round((r()*2-1)*spread),p=$('picture');p.style.setProperty('--picture-size',difficulty.pictureSize+'px');p.style.setProperty('--picture-x',x+'px');p.style.setProperty('--picture-y',y+'px');$('pictureSubject').textContent=q().pic}function startQ(){picked=[];currentResult=null;letterPool=makePool();rev=0;tries=3;ghost=false;ended=false;start=performance.now();$('reveals').textContent=rev;$('reveals').classList.remove('empty');$('cat').textContent=q().cat+' · '+difficulty.label;positionPicture();$('msg').textContent='REVEAL TILES THEN SPELL THE ANSWER';document.querySelectorAll('.qt').forEach((x,i)=>{x.classList.toggle('active',i===qi);if(i===qi){x.classList.remove('done','correct','wrong');x.querySelector('span').textContent='?';x.style.background='conic-gradient(#ff8300 360deg,#aeb8c4 0)'}});grid();ans();letters();if(qi===0)runIntro();else{intro=false;start=performance.now()}}
document.querySelector('[data-power=bomb]').onclick=()=>{[...document.querySelectorAll('.tile:not(.open)')].slice(0,3).forEach(x=>x.click())};
document.querySelector('[data-power=remove]').onclick=()=>{[...document.querySelectorAll('.letter')].filter(x=>!q().a.includes(x.textContent)).slice(0,3).forEach(x=>x.style.visibility='hidden')};
document.querySelector('[data-power=reveal]').onclick=()=>{let need=[...q().a].find((ch,i)=>!picked[i]||picked[i].l!==ch);let b=[...document.querySelectorAll('.letter')].find(x=>x.textContent===need&&!x.classList.contains('used'));if(b)b.click()};
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>chooseCategory(b.dataset.cat));document.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>chooseDifficulty(b.dataset.difficulty));$('nextRound').onclick=beginNextRound;$('seeResult').onclick=showFinalResult;setInterval(()=>{if(qi>=qs.length||ended||intro)return;let elapsed=performance.now()-start,remain=Math.max(0,1-elapsed/ROUND_MS),dot=document.querySelectorAll('.qt')[qi];dot.style.background=`conic-gradient(#ff8300 ${remain*360}deg,#aeb8c4 0)`;if(!ghost&&elapsed>=q().gt){award();$('msg').textContent='CARLY SCORED '+q().gs.toLocaleString()}if(elapsed>=ROUND_MS){$('msg').textContent='TIME UP · '+q().a;finish(false,false)}},50);showCategoryChooser();
</script></body></html>
